<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open-source data, tools and energy system models for civil society protection</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.7;
      color: #222;
      max-width: 780px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      overflow-x: hidden;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1.3rem; margin-top: 2rem; border-bottom: 1px solid #ddd; padding-bottom: 0.25rem; }
    h3 { font-size: 1.1rem; margin-top: 1.5rem; }
    a { color: #1a56a0; }
    blockquote {
      border-left: 4px solid #1a56a0;
      margin: 1rem 0;
      padding: 0.5rem 1rem;
      background: #f4f8ff;
      border-radius: 0 4px 4px 0;
    }
    hr { border: none; border-top: 1px solid #ddd; margin: 1.5rem 0; }
    strong { color: #111; }
    img { max-width: 100%; height: auto; display: block; }
    #content { margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="content">Loading…</div>
  <script>
    fetch('euciv.md')
      .then(r => r.text())
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
        document.querySelectorAll('#content img').forEach(img => {
          img.style.maxWidth = '100%';
          img.style.width = '100%';
          img.style.height = 'auto';
          img.style.display = 'block';
        });
        const h1 = document.querySelector('h1');
        if (h1) document.title = h1.textContent;
      })
      .catch(() => {
        document.getElementById('content').textContent = 'Failed to load content.';
      });
  </script>
</body>
</html>
